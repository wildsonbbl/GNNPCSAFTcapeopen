name: Publish to PyPI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "**/pyproject.toml"

jobs:
  publish:
    runs-on: [windows-latest]
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: "3.13"
          activate-environment: true
      - name: Publish to PyPI
        run: |
          uv build
          uv publish --trusted-publishing always
